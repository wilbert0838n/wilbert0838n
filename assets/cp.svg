<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none">
<style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace} .s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.big{font-size:58px;font-weight:800;letter-spacing:-1px}
.tile{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.bar{transform:scaleX(0);animation:fill 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fill{to{transform:scaleX(1)}}
.blip{animation:blip 1.6s ease-in-out infinite}
@keyframes blip{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0caf5"/><stop offset="1" stop-color="#9ece6a"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0caf5"/><stop offset="1" stop-color="#f7768e"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0caf5"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c0caf5"/><stop offset="1" stop-color="#bb9af7"/></linearGradient></defs>
<g class="tile" style="animation-delay:0.15s"><rect x="0.0" y="10" width="282" height="190" rx="16" fill="#1a1b26" stroke="#3b4261" stroke-width="1.5"/><rect x="24.0" y="10" width="234" height="3" rx="1.5" fill="#2f3549"/><rect class="bar" style="animation-delay:0.45s;transform-origin:24.0px 0" x="24.0" y="10" width="234" height="3" rx="1.5" fill="#9ece6a"/><text x="24.0" y="100" class="s big" fill="url(#g0)">600+</text><text x="24.0" y="138" class="s" font-size="17" font-weight="700" fill="#c0caf5">problems solved</text><text x="24.0" y="164" class="m" font-size="12.5" fill="#565f89">LC · CF · CodeChef · AtCoder</text><circle class="blip" style="animation-delay:0.0s" cx="254.0" cy="40" r="4" fill="#9ece6a"/></g>
<g class="tile" style="animation-delay:0.33s"><rect x="306.0" y="10" width="282" height="190" rx="16" fill="#1a1b26" stroke="#3b4261" stroke-width="1.5"/><rect x="330.0" y="10" width="234" height="3" rx="1.5" fill="#2f3549"/><rect class="bar" style="animation-delay:0.63s;transform-origin:330.0px 0" x="330.0" y="10" width="234" height="3" rx="1.5" fill="#f7768e"/><text x="330.0" y="100" class="s big" fill="url(#g1)">#297</text><text x="330.0" y="138" class="s" font-size="17" font-weight="700" fill="#c0caf5">CodeChef global rank</text><text x="330.0" y="164" class="m" font-size="12.5" fill="#565f89">global leaderboard</text><circle class="blip" style="animation-delay:0.4s" cx="560.0" cy="40" r="4" fill="#f7768e"/></g>
<g class="tile" style="animation-delay:0.51s"><rect x="612.0" y="10" width="282" height="190" rx="16" fill="#1a1b26" stroke="#3b4261" stroke-width="1.5"/><rect x="636.0" y="10" width="234" height="3" rx="1.5" fill="#2f3549"/><rect class="bar" style="animation-delay:0.81s;transform-origin:636.0px 0" x="636.0" y="10" width="234" height="3" rx="1.5" fill="#7aa2f7"/><text x="636.0" y="100" class="s big" fill="url(#g2)">ICPC</text><text x="636.0" y="138" class="s" font-size="17" font-weight="700" fill="#c0caf5">team W Coders</text><text x="636.0" y="164" class="m" font-size="12.5" fill="#565f89">Asia West · Chennai site &#x27;26</text><circle class="blip" style="animation-delay:0.8s" cx="866.0" cy="40" r="4" fill="#7aa2f7"/></g>
<g class="tile" style="animation-delay:0.69s"><rect x="918.0" y="10" width="282" height="190" rx="16" fill="#1a1b26" stroke="#3b4261" stroke-width="1.5"/><rect x="942.0" y="10" width="234" height="3" rx="1.5" fill="#2f3549"/><rect class="bar" style="animation-delay:0.99s;transform-origin:942.0px 0" x="942.0" y="10" width="234" height="3" rx="1.5" fill="#bb9af7"/><text x="942.0" y="100" class="s big" fill="url(#g3)">600+</text><text x="942.0" y="138" class="s" font-size="17" font-weight="700" fill="#c0caf5">players hosted</text><text x="942.0" y="164" class="m" font-size="12.5" fill="#565f89">8-week league on ComputeX</text><circle class="blip" style="animation-delay:1.2s" cx="1172.0" cy="40" r="4" fill="#bb9af7"/></g>
