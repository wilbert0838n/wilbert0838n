<svg xmlns="http://www.w3.org/2000/svg" width="380" height="76" viewBox="0 0 380 76" fill="none">
<style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace} .s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.ring{transform-origin:40px 38px;animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.2);opacity:0}}
.arr{animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(3px,-3px)}}
.sweep{animation:sw 5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-160px)}60%,100%{transform:translateX(540px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><clipPath id="bc"><rect width="380" height="76" rx="16"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#f7768e" stop-opacity="0"/>
<stop offset=".5" stop-color="#f7768e" stop-opacity=".16"/><stop offset="1" stop-color="#f7768e" stop-opacity="0"/></linearGradient></defs>

<g clip-path="url(#bc)">
  <rect width="380" height="76" fill="#1a1b26"/>
  <rect class="sweep" x="0" y="0" width="140" height="76" fill="url(#sh)"/>
</g>
<rect x=".75" y=".75" width="378.5" height="74.5" rx="15.25" stroke="#3b4261" stroke-width="1.5"/>
<circle class="ring" cx="40" cy="38" r="17" fill="#f7768e" fill-opacity=".35"/>
<circle cx="40" cy="38" r="17" fill="#f7768e" fill-opacity=".16" stroke="#f7768e" stroke-opacity=".7"/>
<text x="40" y="44" text-anchor="middle" class="m" font-size="16" font-weight="700" fill="#f7768e">@</text>
<text x="72" y="35" class="s" font-size="18" font-weight="700" fill="#c0caf5">Email</text>
<text x="72" y="56" class="m" font-size="12.5" fill="#565f89">rohannadar88@gmail.com</text>
<g class="arr"><path d="M336 46 L350 32 M340 32 H350 V42" stroke="#f7768e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>
