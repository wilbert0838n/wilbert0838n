<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330" fill="none">
<style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace} .s{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.b{opacity:0;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.ring{transform-origin:498px 40px;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
.glow{animation:gl 8s ease-in-out infinite alternate}
@keyframes gl{to{transform:translate(-120px,60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#7dcfff"/><stop offset=".35" stop-color="#3b4261"/>
  <stop offset=".65" stop-color="#3b4261"/><stop offset="1" stop-color="#7aa2f7"/>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7dcfff" stop-opacity=".35"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect width="590" height="330" rx="18"/></clipPath>
</defs>
<g clip-path="url(#cc)"><rect width="590" height="330" fill="#1a1b26"/>
<circle class="glow" cx="550" cy="30" r="170" fill="url(#gl)"/></g>
<rect x="1" y="1" width="588" height="328" rx="17" stroke="url(#bd)" stroke-width="2"/>
<rect x="464" y="26" width="98" height="28" rx="14" fill="#e0af68" fill-opacity=".12" stroke="#e0af68" stroke-opacity=".5"/>
<circle class="ring" cx="480" cy="40" r="4" fill="#e0af68"/>
<circle cx="480" cy="40" r="4" fill="#e0af68"/>
<text x="492" y="44.5" class="m" font-size="12" font-weight="700" fill="#e0af68">BUILDING</text>
<text x="30" y="58" class="s" font-size="34" font-weight="800" fill="#c0caf5">Rooted</text>
<text x="30" y="86" class="m" font-size="13.5" fill="#565f89">container hosting for Indian engineering students</text>
<g class="b" style="animation-delay:0.25s"><text x="30" y="128" class="m" font-size="15" fill="#7dcfff">▹</text><text x="52" y="128" class="m" font-size="15" fill="#c0caf5">a real Linux box for every student</text></g>
<g class="b" style="animation-delay:0.43s"><text x="30" y="160" class="m" font-size="15" fill="#7dcfff">▹</text><text x="52" y="160" class="m" font-size="15" fill="#c0caf5">sysbox-runc system containers</text></g>
<g class="b" style="animation-delay:0.61s"><text x="30" y="192" class="m" font-size="15" fill="#7dcfff">▹</text><text x="52" y="192" class="m" font-size="15" fill="#c0caf5">Docker-in-container, no --privileged</text></g>
<g class="b" style="animation-delay:0.79s"><text x="30" y="224" class="m" font-size="15" fill="#7dcfff">▹</text><text x="52" y="224" class="m" font-size="15" fill="#c0caf5">built on the ComputeX isolation playbook</text></g>
<rect x="30.0" y="274" width="68.6" height="28" rx="8" fill="#24283b" stroke="#3b4261"/><text x="64.3" y="292.5" text-anchor="middle" class="m" font-size="12" fill="#7dcfff">Docker</text>
<rect x="106.6" y="274" width="105.8" height="28" rx="8" fill="#24283b" stroke="#3b4261"/><text x="159.6" y="292.5" text-anchor="middle" class="m" font-size="12" fill="#7dcfff">sysbox-runc</text>
<rect x="220.5" y="274" width="61.2" height="28" rx="8" fill="#24283b" stroke="#3b4261"/><text x="251.1" y="292.5" text-anchor="middle" class="m" font-size="12" fill="#7dcfff">Linux</text>
<rect x="289.7" y="274" width="61.2" height="28" rx="8" fill="#24283b" stroke="#3b4261"/><text x="320.3" y="292.5" text-anchor="middle" class="m" font-size="12" fill="#7dcfff">Nginx</text>
</svg>
