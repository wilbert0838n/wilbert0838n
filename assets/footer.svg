<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" fill="none">
<style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.w1{animation:mv 9s linear infinite}
.w2{animation:mv 14s linear infinite reverse}
.w3{animation:mv 20s linear infinite}
@keyframes mv{to{transform:translateX(-600px)}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
