  <path class="w2" d="M0 130 q150.0 -14 300.0 0 t300.0 0 q150.0 -14 300.0 0 t300.0 0 q150.0 -14 300.0 0 t300.0 0 q150.0 -14 300.0 0 t300.0 0 V190 H0 Z" fill="#bb9af7" fill-opacity=".18"/>
  <path class="w1" d="M0 145 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 q75.0 -12 150.0 0 t150.0 0 V190 H0 Z" fill="#7aa2f7" fill-opacity=".26"/>
