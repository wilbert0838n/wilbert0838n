<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" fill="none">
<style>
.t{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:26px;fill:#c0caf5}
.i{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:15px;font-weight:700;fill:#9ece6a}
.s{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;fill:#565f89}
.sweep{animation:sw 4.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sw{from{transform:translateX(-260px)}to{transform:translateX(1240px)}}
.in{opacity:0;animation:in .8s ease forwards}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#9ece6a" stop-opacity="0"/>
<stop offset=".5" stop-color="#9ece6a"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/></linearGradient>
<clipPath id="hc"><rect width="1200" height="76" rx="14"/></clipPath></defs>

<g clip-path="url(#hc)">
  <rect width="1200" height="76" fill="#1a1b26"/>
  <rect x="0" y="73" width="1200" height="3" fill="#3b4261"/>
  <rect class="sweep" x="0" y="73" width="240" height="3" fill="url(#sg)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="74.5" rx="13.25" stroke="#3b4261" stroke-width="1.5"/>
<g class="in">
  <text x="26" y="45" class="i">0x05</text>
  <text x="84" y="46" class="t">on github</text>
  <text x="1174" y="45" text-anchor="end" class="s">refreshed daily by a GitHub Action</text>
</g>

</svg>
