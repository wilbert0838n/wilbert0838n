<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="78" viewBox="0 0 1200 78" fill="none">
<style>
.t{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:30px;fill:#c0caf5}
.i{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:16px;font-weight:700;fill:#9ece6a}
.s{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14px;fill:#565f89}
.sweep{animation:sw 4.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sw{from{transform:translateX(-260px)}to{transform:translateX(1240px)}}
.in{opacity:0;animation:in .8s ease forwards}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#9ece6a" stop-opacity="0"/>
<stop offset=".5" stop-color="#9ece6a"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/></linearGradient></defs>

<g class="in">
  <text x="4" y="40" class="i">0x05</text>
  <text x="62" y="41" class="t">on github</text>
  <text x="1196" y="40" text-anchor="end" class="s">commits, streaks, snakes</text>
</g>
<rect x="0" y="62" width="1200" height="2" rx="1" fill="#3b4261"/>
<rect class="sweep" x="0" y="61" width="240" height="4" rx="2" fill="url(#sg)"/>

</svg>
