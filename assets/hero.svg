<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.name{font-family:'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:86px;letter-spacing:-2px}
.role{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:20px;fill:#c0caf5;opacity:0}
.chipt{font-family:'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14px;font-weight:600}
.chip{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.nameg{opacity:0;animation:up 1s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.o1{animation:d1 16s ease-in-out infinite alternate}
.o2{animation:d2 19s ease-in-out infinite alternate}
.o3{animation:d3 23s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(260px,90px)}}
@keyframes d2{to{transform:translate(-300px,-70px)}}
@keyframes d3{to{transform:translate(-180px,120px)}}
.floor{animation:scroll 1.1s linear infinite}
@keyframes scroll{to{transform:translateY(22px)}}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes r0{0%,0.000%{opacity:0;transform:translateY(14px)}3.750%,21.250%{opacity:1;transform:translateY(0)}25.000%,100%{opacity:0;transform:translateY(-14px)}}.r0{animation:r0 12s ease-in-out infinite}@keyframes r1{0%,25.000%{opacity:0;transform:translateY(14px)}28.750%,46.250%{opacity:1;transform:translateY(0)}50.000%,100%{opacity:0;transform:translateY(-14px)}}.r1{animation:r1 12s ease-in-out infinite}@keyframes r2{0%,50.000%{opacity:0;transform:translateY(14px)}53.750%,71.250%{opacity:1;transform:translateY(0)}75.000%,100%{opacity:0;transform:translateY(-14px)}}.r2{animation:r2 12s ease-in-out infinite}@keyframes r3{0%,75.000%{opacity:0;transform:translateY(14px)}78.750%,96.250%{opacity:1;transform:translateY(0)}100.000%,100%{opacity:0;transform:translateY(-14px)}}.r3{animation:r3 12s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#c0caf5"/><stop offset=".3" stop-color="#7aa2f7"/>
  <stop offset=".55" stop-color="#bb9af7"/><stop offset=".8" stop-color="#7dcfff"/><stop offset="1" stop-color="#c0caf5"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
<mask id="floorMask"><rect x="0" y="265" width="1200" height="155" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="1200" height="420" rx="20"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="420" fill="#1a1b26"/>
  <g filter="url(#blur)">
    <circle class="o1" cx="180" cy="110" r="170" fill="#7aa2f7" fill-opacity=".38"/>
    <circle class="o2" cx="1030" cy="300" r="190" fill="#bb9af7" fill-opacity=".34"/>
    <circle class="o3" cx="720" cy="20" r="150" fill="#7dcfff" fill-opacity=".22"/>
  </g>
  <g mask="url(#floorMask)" stroke="#7aa2f7" stroke-opacity=".35" stroke-width="1">
    <g><line x1="600.0" y1="200" x2="-900" y2="460"/><line x1="600.0" y1="200" x2="-790" y2="460"/><line x1="600.0" y1="200" x2="-680" y2="460"/><line x1="600.0" y1="200" x2="-570" y2="460"/><line x1="600.0" y1="200" x2="-460" y2="460"/><line x1="600.0" y1="200" x2="-350" y2="460"/><line x1="600.0" y1="200" x2="-240" y2="460"/><line x1="600.0" y1="200" x2="-130" y2="460"/><line x1="600.0" y1="200" x2="-20" y2="460"/><line x1="600.0" y1="200" x2="90" y2="460"/><line x1="600.0" y1="200" x2="200" y2="460"/><line x1="600.0" y1="200" x2="310" y2="460"/><line x1="600.0" y1="200" x2="420" y2="460"/><line x1="600.0" y1="200" x2="530" y2="460"/><line x1="600.0" y1="200" x2="640" y2="460"/><line x1="600.0" y1="200" x2="750" y2="460"/><line x1="600.0" y1="200" x2="860" y2="460"/><line x1="600.0" y1="200" x2="970" y2="460"/><line x1="600.0" y1="200" x2="1080" y2="460"/><line x1="600.0" y1="200" x2="1190" y2="460"/><line x1="600.0" y1="200" x2="1300" y2="460"/><line x1="600.0" y1="200" x2="1410" y2="460"/><line x1="600.0" y1="200" x2="1520" y2="460"/><line x1="600.0" y1="200" x2="1630" y2="460"/><line x1="600.0" y1="200" x2="1740" y2="460"/><line x1="600.0" y1="200" x2="1850" y2="460"/><line x1="600.0" y1="200" x2="1960" y2="460"/><line x1="600.0" y1="200" x2="2070" y2="460"/></g>
    <g class="floor"><line x1="0" y1="262" x2="1200" y2="262"/><line x1="0" y1="284" x2="1200" y2="284"/><line x1="0" y1="306" x2="1200" y2="306"/><line x1="0" y1="328" x2="1200" y2="328"/><line x1="0" y1="350" x2="1200" y2="350"/><line x1="0" y1="372" x2="1200" y2="372"/><line x1="0" y1="394" x2="1200" y2="394"/><line x1="0" y1="416" x2="1200" y2="416"/><line x1="0" y1="438" x2="1200" y2="438"/></g>
  </g>
  <text x="34" y="46" class="mono" font-size="15" fill="#565f89">~/<tspan fill="#7aa2f7">wilbert0838n</tspan> $ ./hello<tspan class="cur" fill="#c0caf5">▍</tspan></text>
  <g class="mono" font-size="15">
    <circle class="dot" cx="1004" cy="41" r="5" fill="#9ece6a"/>
    <text x="1018" y="46" fill="#565f89">Mumbai · IST</text>
  </g>
  <g class="nameg"><text class="name" x="600.0" y="178" text-anchor="middle" fill="url(#shine)" filter="url(#glow)">Wilbert Nadar</text></g>
  <text class="role r0" x="600.0" y="236" text-anchor="middle">[ systems &amp; infra engineer ]</text><text class="role r1" x="600.0" y="236" text-anchor="middle">[ competitive programmer ]</text><text class="role r2" x="600.0" y="236" text-anchor="middle">[ problem setter @ TSEC CodeCell ]</text><text class="role r3" x="600.0" y="236" text-anchor="middle">[ solo builder of ComputeX ]</text>
  <g class="chip" style="animation-delay:0.90s"><rect x="227.2" y="292" width="197.6" height="34" rx="17" fill="#24283b" fill-opacity=".85" stroke="#7aa2f7" stroke-opacity=".55"/><text x="326.0" y="314" text-anchor="middle" class="chipt" fill="#7aa2f7">TSEC Mumbai · CE &#x27;28</text></g><g class="chip" style="animation-delay:1.05s"><rect x="438.8" y="292" width="180.2" height="34" rx="17" fill="#24283b" fill-opacity=".85" stroke="#bb9af7" stroke-opacity=".55"/><text x="528.9" y="314" text-anchor="middle" class="chipt" fill="#bb9af7">CodeCell Core Team</text></g><g class="chip" style="animation-delay:1.20s"><rect x="633.0" y="292" width="188.9" height="34" rx="17" fill="#24283b" fill-opacity=".85" stroke="#f7768e" stroke-opacity=".55"/><text x="727.5" y="314" text-anchor="middle" class="chipt" fill="#f7768e">ICPC &#x27;26 · W Coders</text></g><g class="chip" style="animation-delay:1.35s"><rect x="836.0" y="292" width="136.8" height="34" rx="17" fill="#24283b" fill-opacity=".85" stroke="#9ece6a" stroke-opacity=".55"/><text x="904.4" y="314" text-anchor="middle" class="chipt" fill="#9ece6a">600+ problems</text></g>
  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="19.5" stroke="#3b4261" stroke-width="1.5"/>
</g>

</svg>
